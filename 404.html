<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Fira Code", "Courier New", Courier, monospace;
            background: #020b06;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; /* Центрируем по вертикали для 404 */
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        .bg-glow {
            position: fixed;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(100px);
            opacity: 0.4;
        }

        .glow-top-left {
            top: -20vw;
            left: -20vw;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%);
        }

        .glow-bottom-right {
            bottom: -20vw;
            right: -20vw;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.2) 0%, transparent 70%); /* Красноватое свечение для ошибки */
        }

        .container {
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 2;
        }

        .error-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(220, 38, 38, 0.3); /* Красная рамка */
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            padding: 60px 40px;
        }

        .error-code {
            font-size: 80px;
            font-weight: 700;
            color: #ef4444; /* Красный цвет */
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .terminal-prompt {
            font-size: 20px;
            color: #10b981;
            font-weight: bold;
            position: relative;
            margin-bottom: 20px;
        }
        
        .terminal-prompt::after {
            content: "";
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #10b981;
            margin-left: 6px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .subtitle {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .comment {
            color: #4fa175;
            font-style: italic;
            opacity: 0.9;
            margin-bottom: 40px;
            display: block;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
        }
        
        .action-btn:hover {
            background: #059669;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="bg-glow glow-top-left"></div>
    <div class="bg-glow glow-bottom-right"></div>

    <div class="container">
        <div class="error-card">
            <div class="error-code">404</div>
            <div class="terminal-prompt">file_not_found</div>
            
            <div class="subtitle">
                Похоже, вы запросили страницу, которой не существует.
            </div>
            
            <span class="comment">// Error: path leads to an empty void.</span>
            
            <a href="/" class="action-btn">
                На главную
            </a>
        </div>
    </div>

</body>
</html>
